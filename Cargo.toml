[package]
name = "vacuum"
version = "0.6.0"
edition = "2024"
license = "MIT"
exclude = ["tests/fixtures/symlinks/broken_link"]

[dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
walkdir = "=2.5.0"
chrono = "=0.4.41"
globset = "=0.4.16"
blake3 = "=1.8.2"

[dev-dependencies]
jsonschema = "=0.42.1"
tempfile = "=3.21.0"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules", rev = "2b71975a6ec185af02548eaa31a5f9e8c6b6bb54" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
